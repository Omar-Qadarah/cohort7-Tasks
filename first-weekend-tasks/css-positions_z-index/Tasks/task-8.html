<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food shop</title>
    <link rel="stylesheet" href="task-8.css">

</head>
<body>
    <div class="site-title">
        <p class="brand">Online</p>
        <p class="tagline">FoodShop</p>
    </div>

    <nav>
        <div class="nav-logo">🍔</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">ContactUs</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Welcome to Online FoodShop</h1>
        <span class="order-now-hero">ORDER NOW</span>

        <div class="hero-card card-prices">
            <img src="../img/f1.jpg" alt="Prices">
            <span class="label">Prices</span>
        </div>

        <div class="hero-card card-specials">
            <img src="../img/f2.jpeg" alt="Specials">
            <span class="label">Specials</span>
        </div>
    </section>

    <h2 class="featured-title">Featured Products</h2>

    <div class="products">
        <div class="product">
            <img src="../img/f3.jpg" alt="dessert">
            <span class="order-badge">ORDER NOW</span>
        </div>
        <div class="product">
            <img src="../img/f4.jpg" alt="rice dish">
            <span class="order-badge">ORDER NOW</span>
        </div>
        <div class="product">
            <img src="../img/f5.jpg" alt="pasta">
            <span class="order-badge">ORDER NOW</span>
        </div>
    </div>

    <footer>
        Copyright © 2020-2021 OnlineFoodShop. All Rights are reserved
    </footer>
</body>
</html>
